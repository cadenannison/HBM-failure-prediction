<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; font-weight: 800; src: url("node_modules/@fontsource/archivo/files/archivo-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Archivo"; font-weight: 700; src: url("node_modules/@fontsource/archivo/files/archivo-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Plex"; font-weight: 400; src: url("node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Plex"; font-weight: 600; src: url("node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1700px; background: #F4F6F6; font-family: "Plex", sans-serif; color: #152120; }
#canvas { width: 1700px; padding: 44px 48px 44px; background: #F4F6F6; }
h1 { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; line-height: 1; }
.sub { font-size: 18px; color: #5A6866; margin-top: 10px; }
.legend { display: flex; gap: 18px; margin-top: 18px; font-size: 14.5px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.tagdot { font-family: "Plex"; font-weight: 600; font-size: 12px; color: #fff; border-radius: 4px; padding: 1px 6px; }
#board { position: relative; width: 1604px; margin-top: 22px; }
.lane { position: absolute; left: 0; width: 1604px; height: 140px; background: #E6ECEB; border-radius: 10px; }
.lane-label { position: absolute; left: 18px; width: 160px; font-family: "Archivo"; font-weight: 700; font-size: 19px; line-height: 1.15; }
.box { position: absolute; width: 250px; height: 104px; background: #FFFFFF; border: 1.5px solid #9AA8A6; border-radius: 10px; padding: 11px 14px; }
.box b { display: block; font-family: "Archivo"; font-weight: 700; font-size: 17px; line-height: 1.15; padding-right: 56px; }
.box span { display: block; font-size: 13.5px; color: #4C5957; margin-top: 5px; line-height: 1.3; }
.box .tags { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.box.new { border: 2.5px solid #0E7A6C; }
.found { position: absolute; left: 0; width: 1604px; height: 54px; border-radius: 10px; background: #152120; color: #fff; display: flex; align-items: center; padding: 0 18px; font-size: 16px; gap: 10px; }
.found b { font-family: "Archivo"; font-weight: 700; font-size: 18px; }
svg#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wl { font-family: "Plex"; font-size: 13px; fill: #4C5957; font-weight: 600; }
</style>
</head>
<body>
<div id="canvas">
  <h1>PANIC (Predictive Anomaly Notification for Interposer Components)</h1>
  <div class="sub">System Architecture · How memory errors become risk scores, fixes and alerts on AWS. Tags show which teammate owns each part.</div>
  <div class="legend" id="legend"></div>
  <div id="board"></div>
</div>
<script>
const OWN = { T1: '#0E7A6C', T2: '#2F6FB3', T3: '#6B57C9', T4: '#A3478A' };
const ROLES = { T1: 'Teammate 1 · Lead and ML', T2: 'Teammate 2 · Data and platform', T3: 'Teammate 3 · MLOps and reliability', T4: 'Teammate 4 · App and business' };
const LANES = ['Data in', 'Training', 'Serving and actions', 'People and operations'];
const BOXES = [
  ['sim', 0, 0, 'Fleet simulator', 'Synthetic data center + replay of real Calchas months', ['T2']],
  ['kin', 0, 1, 'Kinesis Data Streams', 'Live stream of memory errors', ['T2'], true],
  ['s3', 0, 2, 'Lambda → S3', 'Stores the raw error log', ['T2']],
  ['glue', 0, 3, 'AWS Glue', 'Feature job with data contract checks', ['T2', 'T1']],
  ['fs', 0, 4, 'SageMaker Feature Store', 'Offline for training, online for scoring', ['T2']],
  ['ci', 1, 0, 'GitHub Actions', 'Tests on every code change', ['T3']],
  ['pipe', 1, 1, 'SageMaker Pipelines', 'Prepare, train, evaluate; runs tracked in MLflow', ['T3', 'T1'], true],
  ['reg', 1, 2, 'Model Registry', 'Human approval before release', ['T3', 'T1']],
  ['eb', 2, 0, 'EventBridge', 'Hourly scoring trigger', ['T2']],
  ['score', 2, 1, 'Scoring Lambda', 'Reads online features, calls the models', ['T4']],
  ['ep', 2, 2, 'SageMaker endpoint', 'Serverless, 4 models (row to server)', ['T3']],
  ['sf', 2, 3, 'Step Functions', 'Retire row · approve bank · sign off drain', ['T4'], true],
  ['ddb', 2, 4, 'DynamoDB', 'Audit log of every decision', ['T4']],
  ['app', 3, 0, 'Streamlit dashboard', 'Fleet map and Approve button', ['T4']],
  ['api', 3, 1, 'API Gateway', 'Scores, status and approvals', ['T4'], true],
  ['sns', 3, 3, 'Amazon SNS', 'Alerts to the on-call phone', ['T4']],
  ['mon', 3, 4, 'CloudWatch + Evidently', 'Dashboards, alarms, drift checks', ['T3']],
];
const LX = 200, CW = 250, CG = (1604 - LX - 5 * CW) / 4, LH = 140, LG = 22, BH = 104;
const laneTop = l => l * (LH + LG);
const bx = c => LX + c * (CW + CG), by = l => laneTop(l) + (LH - BH) / 2;
const board = document.getElementById('board');
LANES.forEach((name, l) => {
  board.insertAdjacentHTML('beforeend', `<div class="lane" style="top:${laneTop(l)}px"></div><div class="lane-label" style="top:${laneTop(l) + LH / 2 - 12 - (name.length > 14 ? 11 : 0)}px">${name}</div>`);
});
const pos = {};
BOXES.forEach(([id, l, c, t, s, own, isNew]) => {
  pos[id] = { x: bx(c), y: by(l), w: CW, h: BH };
  const tags = own.map(o => `<i class="tagdot" style="background:${OWN[o]}">${o}</i>`).join('');
  board.insertAdjacentHTML('beforeend', `<div class="box${isNew ? ' new' : ''}" style="left:${bx(c)}px;top:${by(l)}px"><div class="tags">${tags}</div><b>${t}</b><span>${s}</span></div>`);
});
const FY = laneTop(4);
board.insertAdjacentHTML('beforeend', `<div class="found" style="top:${FY}px"><b>Foundation</b> <i class="tagdot" style="background:${OWN.T2}">T2</i> Terraform · VPC · IAM users per teammate · S3 · AWS Budgets alert · teardown script</div>`);
board.style.height = (FY + 54) + 'px';
// wires
const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(svgNS, 'svg'); svg.id = 'wires'; svg.setAttribute('width', 1604); svg.setAttribute('height', FY + 54);
svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4C5957"/></marker></defs>`;
board.appendChild(svg);
const path = (d, label, lx, ly) => {
  const p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#4C5957'); p.setAttribute('stroke-width', 2); p.setAttribute('marker-end', 'url(#ah)'); svg.appendChild(p);
  if (label) { const t = document.createElementNS(svgNS, 'text'); t.setAttribute('x', lx); t.setAttribute('y', ly); t.setAttribute('class', 'wl'); t.textContent = label; svg.appendChild(t); }
};
const R = id => pos[id];
const right = id => [R(id).x + R(id).w, R(id).y + R(id).h / 2], left = id => [R(id).x - 3, R(id).y + R(id).h / 2];
const H = (a, b) => { const [x1, y1] = right(a), [x2, y2] = left(b); path(`M${x1} ${y1} H${x2}`); };
['sim', 'kin', 's3', 'glue', 'fs'].reduce((a, b) => (H(a, b), b));
H('ci', 'pipe'); H('pipe', 'reg');
['eb', 'score', 'ep', 'sf', 'ddb'].reduce((a, b) => (H(a, b), b));
H('app', 'api');
// Feature Store offline -> Pipelines (elbow through the gap between lanes 0 and 1)
{ const f = R('fs'), p = R('pipe'); const gy = laneTop(1) - LG / 2; path(`M${f.x + f.w / 2} ${f.y + f.h} V${gy} H${p.x + p.w / 2} V${p.y - 3}`, 'training data', f.x + f.w / 2 - 102, gy - 4); }
// Registry -> endpoint (straight down)
{ const r = R('reg'), e = R('ep'); path(`M${r.x + r.w / 2} ${r.y + r.h} V${e.y - 3}`, 'approved models', r.x + r.w / 2 + 8, laneTop(2) - 4); }
// API Gateway -> Step Functions (approve)
{ const a = R('api'), s = R('sf'); const gy = laneTop(3) - LG / 2; const mx = R('ep').x + CW / 2; path(`M${a.x + a.w} ${a.y + a.h / 2} H${mx} V${gy} H${s.x + 60} V${s.y + s.h + 3}`, 'approve or reject', mx + 10, gy - 4); }
// Step Functions -> SNS (down)
{ const s = R('sf'), n = R('sns'); path(`M${s.x + s.w - 70} ${s.y + s.h} V${n.y - 3}`); }
// DynamoDB -> monitoring (down)
{ const d = R('ddb'), m = R('mon'); path(`M${d.x + d.w / 2} ${d.y + d.h} V${m.y - 3}`); }
// legend
const lg = document.getElementById('legend');
Object.keys(ROLES).forEach(k => lg.insertAdjacentHTML('beforeend', `<span><i class="tagdot" style="background:${OWN[k]}">${k}</i>${ROLES[k]}</span>`));
lg.insertAdjacentHTML('beforeend', `<span><i style="display:inline-block;width:22px;height:14px;border:2.5px solid #0E7A6C;border-radius:4px;background:#fff"></i>New beyond the labs</span>`);
document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
